version: '3.9'

services:
  ubuntu:
    image: ubuntu:latest
    container_name: ubuntu-container
    command: /usr/sbin/sshd -D
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "8888:22"            # 主机 8888 -> 容器 22 (SSH)
    volumes:
      - ./data:/data
    gpus: all                # ✅ 开启 GPU（需要主机已装 NVIDIA Container Toolkit）
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
